# Local cloud-in-a-box: the whole microservice system with one command.
#
#   docker compose up --build
#
# Lab requirements visible in this file:
#  - Containerization        : every service is its own container/image
#  - Independent databases   : one named volume per data-owning service
#    ("all in Docker")         (auth-data, menu-data, order-data, billing-data)
#  - Event-driven            : redis is the event bus + log channel
#  - Health checks           : every service has a healthcheck
#  - Load balancing demo     : docker compose up --scale menu-service=3
#                              (gateway round-robins via the registry)

x-service-defaults: &defaults
  restart: unless-stopped
  environment: &env-defaults
    REDIS_URL: redis://redis:6379
    REGISTRY_URL: http://registry:4000
    DISCOVERY_MODE: registry

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  registry:
    <<: *defaults
    build: { context: ., args: { SERVICE: registry } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: registry
      PORT: "4000"
    healthcheck: &http-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s

  auth-service:
    <<: *defaults
    build: { context: ., args: { SERVICE: auth } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: auth-service
      PORT: "4001"
      DATA_DIR: /data
      JWT_SECRET: lab-secret-change-me
    volumes:
      - ./data/auth:/data
    depends_on: { redis: { condition: service_healthy }, registry: { condition: service_started } }
    healthcheck: *http-health

  menu-service:
    <<: *defaults
    build: { context: ., args: { SERVICE: menu } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: menu-service
      PORT: "4002"
      DATA_DIR: /data
    volumes:
      - ./data/menu:/data
    depends_on: { redis: { condition: service_healthy }, registry: { condition: service_started } }
    healthcheck: *http-health

  order-service:
    <<: *defaults
    build: { context: ., args: { SERVICE: order } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: order-service
      PORT: "4003"
      DATA_DIR: /data
    volumes:
      - ./data/order:/data
    depends_on: { redis: { condition: service_healthy }, registry: { condition: service_started } }
    healthcheck: *http-health

  billing-service:
    <<: *defaults
    build: { context: ., args: { SERVICE: billing } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: billing-service
      PORT: "4004"
      DATA_DIR: /data
      TAX_RATE: "0.13"
    volumes:
      - ./data/billing:/data     
    depends_on: { redis: { condition: service_healthy }, registry: { condition: service_started } }
    healthcheck: *http-health

  logging-service:
    <<: *defaults
    build: { context: ., args: { SERVICE: logging } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: logging-service
      PORT: "4005"
    depends_on: { redis: { condition: service_healthy }, registry: { condition: service_started } }
    healthcheck: *http-health

  gateway:
    <<: *defaults
    build: { context: ., args: { SERVICE: gateway } }
    environment:
      <<: *env-defaults
      SERVICE_NAME: gateway
      PORT: "8080"
      RATE_LIMIT_PER_MIN: "100"
      DATA_DIR: /data                 # tenant config.json lives here
    volumes:
      - ./data/gateway:/data
    ports: ["8080:8080"]              # the ONLY port exposed to the outside
    depends_on: { redis: { condition: service_healthy }, registry: { condition: service_started } }
    healthcheck: *http-health

volumes:
  auth-data:
  menu-data:
  order-data:
  billing-data:
