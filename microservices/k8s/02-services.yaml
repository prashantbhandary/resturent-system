# The five business/platform services.
#
# In Kubernetes, Service objects + DNS replace our custom registry
# (DISCOVERY_MODE=dns), and kube-proxy load-balances across pod replicas —
# i.e. k8s natively provides the Service Discovery and Load Balancing the
# compose setup demonstrates by hand. Liveness/readiness probes hit /health
# (Health checks requirement).
#
# NOTE: images are built locally, e.g. for minikube:
#   eval $(minikube docker-env)
#   docker build -t restaurant/auth:lab    --build-arg SERVICE=auth    .
#   docker build -t restaurant/menu:lab    --build-arg SERVICE=menu    .
#   docker build -t restaurant/order:lab   --build-arg SERVICE=order   .
#   docker build -t restaurant/billing:lab --build-arg SERVICE=billing .
#   docker build -t restaurant/logging:lab --build-arg SERVICE=logging .
#   docker build -t restaurant/gateway:lab --build-arg SERVICE=gateway .
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: restaurant
spec:
  replicas: 1            # owns a SQLite volume -> single writer
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth
          image: restaurant/auth:lab
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: auth-service }
            - { name: PORT, value: "4001" }
            - { name: REDIS_URL, value: redis://redis:6379 }
            - { name: DISCOVERY_MODE, value: dns }
            - { name: DATA_DIR, value: /data }
            - { name: JWT_SECRET, value: lab-secret-change-me }
          ports: [{ containerPort: 4001 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}   # lab-grade persistence; use a PVC in production
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: restaurant }
spec:
  selector: { app: auth-service }
  ports: [{ port: 4001, targetPort: 4001 }]
---
