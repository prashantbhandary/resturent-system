name: CI

# Runs on every push to main and on every pull request targeting main.
# Pull requests get a green/red check so you (or a reviewer) can see at a
# glance whether the change is safe to merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  microservices:
    name: Microservices build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        working-directory: microservices
        run: docker compose build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
